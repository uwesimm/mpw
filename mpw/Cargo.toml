[package]
name = "mpw"
version = "0.3.0"
authors = ["Uwe Simm <uwe.simm@gmx.net>"]
edition = "2021"
license = "MIT"
description = "Command-line and HTTP password generator implementing the Master Password algorithm"
repository = "https://github.com/uwesimm/mpw"

[features]
default = []
tls = ["actix-web/rustls-0_23", "rustls", "rustls-pki-types"]

[dependencies]
simple_logger = "5.2.0"
rpassword = "7.5.0"
log = "0.4.22"
clap = { version = "4.5.60", features = ["derive"] }
anyhow = "1.0.102"
actix-web = { version = "4.13.0", default-features = false, features = ["macros"] }
masterpassword-rs = { path = "../masterpassword-rs" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
rustls = { version = "0.23", optional = true }
rustls-pki-types = { version = "1", optional = true, features = ["std"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
