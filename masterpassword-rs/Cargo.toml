[package]
name = "masterpassword-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust implementation of the Master Password algorithm"
repository = "https://github.com/uwesimm/mpw"

[dependencies]
scrypt = "0.11.0"
hmac = "0.12.1"
sha2 = "0.10.9"
phf = { version = "0.13.1", features = ["macros"] }
anyhow = "1.0.102"
